name: api

on:
  push:
    branches: [main]
    paths: ['TimelyNotes.Backend/**', '.github/workflows/api.yml']
  workflow_dispatch:

# A deploy is an upload to one slot: never let two overlap.
concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TimelyNotes.Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet test
      - run: dotnet publish TimelyNotes.API -c Release -o publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: timely-notes-api
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: TimelyNotes.Backend/publish
