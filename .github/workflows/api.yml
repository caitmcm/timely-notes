name: api

on:
  push:
    branches: [main]
    paths: ['TimelyNotes.Backend/**', '.github/workflows/api.yml']
  workflow_dispatch:

# A deploy is an upload to one slot: never let two overlap.
concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # OIDC: the login step trades this token for a short-lived Azure one, so there is no
      # credential to store. The secrets below are identifiers, not passwords.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: TimelyNotes.Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet test
      - run: dotnet publish TimelyNotes.API -c Release -o publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_37F8A0E96DDE4F0CA1AD834E2F8894AD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F114A8DC76EC41FC942800F3BA2AD22B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B85AA43FD0324857BE6585A1F3AAC505 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: timely-notes-api
          # Relative to the workspace, not the job's working-directory: `uses` steps ignore it.
          package: TimelyNotes.Backend/publish
