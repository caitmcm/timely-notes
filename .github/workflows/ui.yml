name: ui

on:
  push:
    branches: [main]
    paths: ['timely-notes-ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: timely-notes-ui/package-lock.json
      - run: npm ci
        working-directory: timely-notes-ui
      - run: npm test
        working-directory: timely-notes-ui
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: timely-notes-ui
          output_location: dist
          # No managed functions: the API is a separate App Service.
          api_location: ''
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
